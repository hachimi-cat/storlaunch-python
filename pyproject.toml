[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "storlaunch"
version = "0.1.0"
description = "Official Python SDK for Storlaunch — payment (checkout sessions, plans, subscriptions, invoices, receipts, customers, portal sessions, webhooks), storefront (products, licenses, deliveries), shipping, inventory, ledger, reports, payouts, discount codes, account (pixels, feeds, blog, referrals, abandoned cart, API keys, audit log, domains), analytics, billing, modules, manual orders, onboarding, buyer checkout + addresses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["storlaunch", "forjio", "ecommerce", "storefront", "payments", "saas"]
authors = [{ name = "Forjio", email = "hello@storlaunch.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.21.1",
]

[project.urls]
Homepage = "https://storlaunch.com"
Source = "https://github.com/hachimi-cat/storlaunch-python"
Issues = "https://github.com/hachimi-cat/storlaunch-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["storlaunch"]
